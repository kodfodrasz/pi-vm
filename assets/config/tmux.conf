set -g mouse on

# Better key/focus reporting for terminal UIs such as pi.
set -g extended-keys on
set -g extended-keys-format csi-u
set -g focus-events on

# Keep window numbers compact after closing windows.
set -g renumber-windows on

set -g window-status-current-style bg=yellow,fg=black
set-option -g history-limit 10000
set-option -g update-environment "SSH_AUTH_SOCK \
                                  SSH_CONNECTION \
                                  DISPLAY"
set -g status-right ' %Y-%m-%d %H:%M#[default]'

#set-option -g default-shell /usr/bin/fish

# OSC 9;4 Progressbar function.
set -as terminal-features ',xterm*:progressbar:extkeys'

# workaround for Windows Terminal producing strange control chars on tmux startup

# https://serverfault.com/questions/1130064/why-is-the-windows-11-terminal-pushing-escape-sequences-to-tmux
# ]11;rgb:0c0c/0c0c/0c0c\
#
set -sg escape-time 50
