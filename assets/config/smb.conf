[global]
    workgroup = WORKGROUP
    server role = standalone server
    security = user
    map to guest = never

    server min protocol = SMB2
    server signing = required
    disable spoolss = yes
    load printers = no
    printing = bsd
    printcap name = /dev/null

    logging = systemd
    max log size = 1024

    # Home LAN and VPN. Loopback is needed for local administration.
    hosts allow = 127.0.0.1 10.0.0.0/8 192.168.100.0/24
    hosts deny = 0.0.0.0/0

    vfs objects = catia fruit streams_xattr
    fruit:metadata = stream
    fruit:model = MacSamba
    fruit:posix_rename = yes
    fruit:veto_appledouble = no
    fruit:nfs_aces = no
    veto files = /._*/.DS_Store/
    delete veto files = yes

[homes]
    comment = Home Directories
    browseable = no
    read only = no
    valid users = %S
    create mask = 0644
    directory mask = 0755
